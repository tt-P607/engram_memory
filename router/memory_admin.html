<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Engram · 记忆档案</title>
  <style>
    :root {
      color-scheme: light; --ink:#24353b; --muted:#748187; --navy:#192c35;
      --navy2:#2a424a; --paper:#f4f1e9; --sheet:#fffdf8; --line:#dfdbd1;
      --brass:#bc925d; --green:#547965; --red:#a3584e;
      --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
      --sans:"Segoe UI","Microsoft YaHei UI","Noto Sans CJK SC",sans-serif;
      --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.6 var(--sans);
      background:radial-gradient(ellipse at 86% 0,rgba(188,146,93,.11),transparent 33rem),
      repeating-linear-gradient(0deg,rgba(50,63,64,.018) 0,rgba(50,63,64,.018) 1px,transparent 1px,transparent 5px),var(--paper)}
    button,input,select{font:inherit} button{cursor:pointer}
    .layout{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}
    aside{position:relative;display:flex;flex-direction:column;padding:28px 17px 20px;overflow:hidden;color:#edf0eb;background:linear-gradient(155deg,rgba(255,255,255,.04),transparent 45%),var(--navy)}
    aside:after{position:absolute;right:-115px;bottom:42px;width:260px;height:260px;border:1px solid rgba(188,146,93,.17);border-radius:50%;box-shadow:0 0 0 25px rgba(188,146,93,.025),0 0 0 50px rgba(188,146,93,.02);content:"";pointer-events:none}
    .brand{display:flex;align-items:center;gap:12px;padding:0 7px 31px}.seal{display:grid;width:38px;height:38px;place-items:center;border:1px solid #c9a878;color:#e1bf8b;font:19px var(--serif);transform:rotate(-4deg)}
    .brand strong{display:block;font:18px/1.2 var(--serif);letter-spacing:.03em}.brand small{color:#aab6b5;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
    .rail-label{margin:0 10px 9px;color:#829396;font-size:10px;letter-spacing:.16em}
    nav{position:relative;z-index:1;display:grid;gap:5px}
    .nav{width:100%;padding:10px 12px;border:1px solid transparent;border-radius:6px;color:#b9c3c1;background:transparent;text-align:left;transition:.15s}
    .nav:hover{color:#fff;background:#ffffff0c}.nav[aria-current=page]{border-color:#dbb88233;color:#fff8ec;background:linear-gradient(90deg,#bc925d2b,#bc925d0a)}
    .glyph{display:inline-block;width:24px;color:#d1ad77;font:17px var(--serif)}
    .rail-foot{position:relative;z-index:1;margin-top:auto;padding:16px 9px 0;border-top:1px solid #ffffff24;color:#92a09f;font-size:11px}
    .rail-foot strong{display:block;color:#d6dcd6;font-weight:500}
    main{min-width:0;padding:0 34px 50px}.topline{display:flex;min-height:70px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .crumb{color:var(--muted);font-size:11px;letter-spacing:.08em}.top-actions{display:flex;align-items:center;gap:14px}
    .local{color:#718278;font-size:10px;letter-spacing:.12em}.local:before{display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#6f967c;content:""}
    .refresh,.soft{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fffdf8}
    .refresh{width:35px;padding:0;font-size:17px}.refresh:hover,.soft:hover{border-color:#b9a47f}
    #view{max-width:1400px;margin:0 auto;padding-top:27px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}
    .eyebrow{margin:0 0 6px;color:#9c7d53;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}h1{margin-bottom:4px;font:34px/1.15 var(--serif);letter-spacing:-.02em}h2{margin-bottom:11px;font:22px/1.25 var(--serif)}h3{margin-bottom:7px;font:17px/1.3 var(--serif)}
    .sub{max-width:700px;margin:0;color:var(--muted);font-size:12px}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
    .stat{position:relative;min-height:118px;padding:17px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,#fffdf8,#f9f6ee);overflow:hidden}
    .stat:after{position:absolute;right:-25px;bottom:-55px;width:105px;height:105px;border:1px solid #bc925d38;border-radius:50%;content:""}
    .stat label,.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin:7px 0;color:var(--navy);font:32px/1 var(--serif)}
    .band{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-top:14px;padding:17px 20px;border-radius:7px;color:#eef0eb;background:var(--navy2)}
    .band h2{margin:0 0 3px;color:#f8f4e9;font-size:18px}.band p{margin:0;color:#c2ccca;font-size:11px}.band-side{display:flex;gap:22px}
    .band-side small{display:block;color:#aab9b7;font-size:9px;letter-spacing:.1em}.band-side strong{display:block;margin-top:3px;color:#f0d6ad;font:15px var(--serif)}
    .split{display:grid;grid-template-columns:minmax(260px,.82fr) minmax(0,1.4fr);gap:14px;align-items:start}
    .panel{min-width:0;padding:17px;border:1px solid var(--line);border-radius:7px;background:#fffdf8df}
    .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h2{margin:0;font-size:19px}
    .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.filters input,.filters select{min-width:0;height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:5px;outline:none;background:#fffdf8}
    .filters input{flex:1 1 130px}.filters input:focus,.filters select:focus{border-color:#aa8c62;box-shadow:0 0 0 3px #bc925d21}
    .primary{height:36px;padding:5px 13px;border:1px solid var(--navy);border-radius:5px;color:white;background:var(--navy)}.primary:hover{background:#2b4149}
    .list{display:grid;gap:7px}.record{width:100%;padding:11px 12px;border:1px solid #e5e1d7;border-radius:5px;color:var(--ink);background:#ffffff91;text-align:left;transition:.14s}
    .record:hover{border-color:#bba27c;background:#fffefa;transform:translateY(-1px)}.record[aria-pressed=true]{border-color:#b38d5a;background:#fbf6eb;box-shadow:inset 3px 0 #b38d5a}
    .record-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.record-title{font-weight:650;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;color:#899294;font-size:10px}
    .preview{display:-webkit-box;margin:6px 0 0;overflow:hidden;color:#69777a;font-size:11px;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .badge{display:inline-flex;flex:none;align-items:center;min-height:20px;padding:1px 7px;border:1px solid #e3d7c5;border-radius:99px;color:#806847;background:#f4ecdf;font:9px var(--mono);white-space:nowrap}
    .good{border-color:#d6e1d8;color:#547965;background:#edf4ee}.bad{border-color:#ead5d0;color:#a3584e;background:#faf0ee}.quiet{border-color:#dfe1dc;color:#748080;background:#f1f2ed}
    .detail{min-height:270px;padding:20px}.detail-head{padding-bottom:15px;border-bottom:1px solid var(--line)}.detail-head h2{margin:6px 0;overflow-wrap:anywhere}
    .detail-section{margin-top:17px}.detail-section h3{display:flex;align-items:center;gap:8px;color:#526369;font:10px var(--sans);font-weight:700;letter-spacing:.13em;text-transform:uppercase}
    .detail-section h3:after{flex:1;height:1px;background:#e6e2d8;content:""}.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#36474c;font-size:13px;line-height:1.8}
    .source,.revision,.persona{margin-top:8px;padding:12px;border:1px solid #e6e2d8;border-radius:5px;background:#fffefa}
    .source-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;color:#6c787a;font-size:10px}.source-note{margin:7px 0 0;color:#4f6064;font-size:11px}
    .snapshot{margin-top:9px;padding:9px 11px;border-left:2px solid #c19a67;background:#f7f4ed}.snapshot blockquote{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.7}
    .memory-open:focus-visible{outline:2px solid #a8814f;outline-offset:2px}
    .memory-open{min-height:31px;max-width:100%;margin-top:9px;padding:4px 9px;border:1px solid #d9d1c2;border-radius:4px;color:#465b5b;background:#f8f5ed;font-size:10px;overflow-wrap:anywhere}
    .memory-open:hover{border-color:#ad926b;background:#fffaf0}
    .empty,.error,.loading{padding:25px 12px;color:#849091;text-align:center}.error{color:#a3584e}.loading:before{display:inline-block;width:12px;height:12px;margin-right:7px;border:1px solid #b9aa91;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite;content:""}
    .persona-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.persona{margin:0;padding:15px}.persona h3{overflow-wrap:anywhere}.persona-id{margin:-2px 0 9px;color:#899294}.footnote{margin:14px 0;color:#909998;font-size:10px}.mono{font:10px var(--mono);overflow-wrap:anywhere}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:1050px){main{padding-right:22px;padding-left:22px}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.band{grid-template-columns:1fr}.band-side{flex-wrap:wrap}}
    @media(max-width:720px){.layout{display:block}aside{padding:13px 12px 9px}.brand{padding:0 4px 12px}.brand strong{font-size:16px}.rail-label,.rail-foot{display:none}nav{display:flex;overflow-x:auto;gap:4px}.nav{flex:none;width:auto;padding:8px 9px;font-size:11px}.glyph{width:19px}
      main{padding:0 13px 28px}.topline{min-height:53px}#view{padding-top:19px}.heading{align-items:start;margin-bottom:17px}h1{font-size:29px}.split{grid-template-columns:1fr}.detail{min-height:220px;padding:16px}.persona-grid{grid-template-columns:1fr}.overview{gap:7px}.stat{min-height:106px;padding:13px}.stat strong{font-size:29px}.band-side{gap:15px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="seal" aria-hidden="true">E</span><span><strong>Engram</strong><small>Memory archive</small></span></div>
      <p class="rail-label">档案目录</p>
      <nav aria-label="档案栏目">
        <button class="nav" data-view="overview" aria-current="page"><span class="glyph">⌂</span>运行概览</button>
        <button class="nav" data-view="memories"><span class="glyph">▤</span>正式记忆</button>
        <button class="nav" data-view="personas"><span class="glyph">♙</span>人物印象</button>
      </nav>
      <div class="rail-foot"><strong>本地记忆管理</strong>正式记忆、版本来源与人物印象。</div>
    </aside>
    <main>
      <div class="topline"><span class="crumb">ENGRAM / <span id="crumb">运行概览</span></span><div class="top-actions"><span class="local">LOCAL ACCESS</span><button class="refresh" id="refresh" aria-label="刷新" title="刷新">↻</button></div></div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <script>
    "use strict";
    const root = document.getElementById("view"), crumb = document.getElementById("crumb");
    const titles = {overview:"运行概览",memories:"正式记忆",personas:"人物印象"};
    const state = {view:"overview",id:null,q:"",status:""};
    function el(tag, cls, text) { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined&&text!==null)n.textContent=String(text); return n; }
    function date(value) { if(value===null||value===undefined||value==="")return "时间未知"; const d=new Date(typeof value==="number"?value*1000:value); return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); }
    async function api(path,options={}) {
      const r=await fetch(path,{headers:{Accept:"application/json"},cache:"no-store",credentials:"same-origin",...options});
      let data={}; try{data=await r.json()}catch(_){}
      if(!r.ok)throw new Error(data.detail||("请求失败（"+r.status+"）")); return data;
    }
    function message(parent,cls,text){parent.replaceChildren(el("div",cls,text))}
    function heading(kicker,title,sub){const h=el("div","heading"),c=el("div");c.append(el("p","eyebrow",kicker),el("h1","",title),el("p","sub",sub));h.append(c);return h}
    const labels={ACTIVE:"可用",TOMBSTONED:"已作废",MERGED:"已合并",AVAILABLE:"来源可读取",REDACTED:"来源已隐私删除",NOT_CAPTURED:"来源缺失",UNKNOWN:"未知",FACT:"事实",EVENT:"经历",PREFERENCE:"偏好",CHAT_MESSAGE:"聊天消息",LEGACY_IMPORT:"历史导入"};
    Object.assign(labels,{RELATIONSHIP:"关系",COMMITMENT:"约定",PERSONAL_STATE:"个人状态",SOCIAL_PATTERN:"社交模式",INITIAL:"初次记录",DEVELOPMENT:"经历发展",CORRECTION:"更正",CLARIFICATION:"澄清",NEW_EVIDENCE:"补充来源",EXPLICIT_CORRECTION:"明确更正",ADMIN_CORRECTION:"管理员更正",MIGRATION_REWRITE:"迁移整理",MESSAGE_SET:"原始消息",ACTOR_WRITE:"主动记忆",SYSTEM_EVENT:"系统事件",LEGACY_RECORD:"历史记录",ADMIN:"管理员",EXTERNAL:"外部来源"});
    function label(value){return labels[value]||value||"未知"}
    function badge(value){const t=String(value||"UNKNOWN"),c=t==="ACTIVE"?"badge good":t==="TOMBSTONED"?"badge bad":"badge quiet";return el("span",c,label(t))}
    function personText(person){if(!person)return "人物未记录";const id=person.person_id,name=person.subject_label||person.label||person.subject_key;return name&&id&&name!==id?name+" · "+id:name||id||"人物未记录"}
    function section(parent,title){const s=el("section","detail-section");s.append(el("h3","",title));parent.append(s);return s}
    function sourceCards(parent,sources){
      const area=section(parent,"关联来源");
      if(!sources||!sources.length){area.append(el("p","empty","没有记录关联来源。"));return}
      for(const s of sources){const card=el("article","source");const top=el("div","source-head");top.append(badge(s.source_type),el("span","mono",s.evidence_id));if(s.revision_no)top.append(el("span","","第 "+s.revision_no+" 版"));if(s.observed_at)top.append(el("span","",date(s.observed_at)));card.append(top);
        if(s.note)card.append(el("p","source-note",s.note));if(s.source_ref)card.append(el("p","source-note","来源标记："+s.source_ref));
        for(const m of s.messages||[]){const snap=el("div","snapshot"),meta=el("div","source-head");meta.append(badge(m.snapshot_status),el("span","mono","流 "+m.stream_id),el("span","mono","消息 "+m.message_id));if(m.speaker)meta.append(el("span","",m.speaker));if(m.observed_at)meta.append(el("span","",date(m.observed_at)));snap.append(meta);snap.append(el("blockquote","",m.content||"来源快照正文不可用。"));card.append(snap)}
        area.append(card);
      }
    }
    function split(title){const grid=el("div","split"),left=el("section","panel"),head=el("div","panel-head"),list=el("div","list"),right=el("section","panel detail");head.append(el("h2","",title));left.append(head,list);message(right,"empty","从左侧选择一条记录查看档案。");grid.append(left,right);return{grid,left,list,right}}
    function record(item,idKey,title,preview,meta,select){const b=el("button","record");b.type="button";b.setAttribute("aria-pressed",String(item[idKey]===state.id));const top=el("span","record-top");top.append(el("span","record-title",title||"未命名记录"),badge(item.status));b.append(top);const m=el("span","meta");for(const v of meta||[])if(v)m.append(el("span","",v));b.append(m);if(preview)b.append(el("span","preview",preview));b.addEventListener("click",select);return b}
    async function render(){
      root.replaceChildren(el("div","loading","正在读取档案…"));
      try{if(state.view==="overview")await overview();else if(state.view==="memories")await memories();else await personas()}
      catch(e){root.replaceChildren(heading("读取状态","档案暂不可用","请确认从本机打开管理页，且 Engram vNext Runtime 已就绪。"),el("div","panel error",e.message))}
    }
    async function overview(){
      const r=await api("/engram-memory/api/status"),m=r.memory_counts||{};
      const h=heading("Runtime overview","记忆档案","正式记忆、版本来源与人物印象。");
      const grid=el("div","overview");
      for(const [label,value,note] of [["正式记忆",m.ACTIVE||0,"当前可用"],["记忆版本",r.revision_count||0,"包含保留的历史版本"],["已作废",m.TOMBSTONED||0,"正文与来源保留"],["已合并",m.MERGED||0,"版本与关系保留"]]){
        const card=el("div","stat");card.append(el("label","",label),el("strong","",value),el("small","",note));grid.append(card)}
      const band=el("section","band"),copy=el("div"),side=el("div","band-side");copy.append(el("h2","","自然闪回"));
      if(r.flashback&&typeof r.flashback.enabled==="boolean"){
        const flashback=r.flashback.effective?"已就绪":r.flashback.enabled?"已配置开启，待校准":"配置关闭";
        copy.append(el("p","",r.flashback.reason||""));const status=el("div");status.append(el("small","","自动闪回"),el("strong","",flashback));side.append(status);
      }
      band.append(copy,side);root.replaceChildren(h,grid,band);
    }
    function filter(label,options){
      const f=el("form","filters"),input=el("input"),select=options?el("select"):null;input.type="search";input.placeholder=label;input.setAttribute("aria-label",label);input.value=state.q;f.append(input);
      if(select){select.setAttribute("aria-label","按状态筛选");for(const [v,t] of options){const o=el("option","",t);o.value=v;select.append(o)}select.value=state.status||"ACTIVE";f.append(select)}
      const go=el("button","primary","查找");go.type="submit";f.append(go);f.addEventListener("submit",e=>{e.preventDefault();state.q=input.value.trim();state.status=select?select.value:"";state.id=null;render()});return f;
    }
    async function memories(){
      const p=split("正式记忆"),opts=[["ACTIVE","当前有效"],["MERGED","已合并"],["TOMBSTONED","已作废"],["ALL","全部状态"]];
      p.left.querySelector(".panel-head").after(filter("检索标题或正文",opts));
      const h=heading("Canonical memories","正式记忆","浏览正式记忆的当前内容、版本沿革、人物信息与关联来源。");
      const params=new URLSearchParams({q:state.q,status:state.status||"ACTIVE"}),r=await api("/engram-memory/api/memories?"+params);
      p.list.replaceChildren();if(!r.items.length)message(p.list,"empty","没有找到符合条件的正式记忆。");
      for(const x of r.items)p.list.append(record(x,"memory_id",x.title,x.preview,[label(x.memory_kind),personText(x.subject),x.memory_id,date(x.updated_at||x.last_experienced_at)],()=>{state.id=x.memory_id;detailMemory(p.right,x.memory_id)}));
      root.replaceChildren(h,p.grid);if(state.id)detailMemory(p.right,state.id);
    }
    async function detailMemory(target,id){
      message(target,"loading","正在读取记忆与来源…");
      try{const r=await api("/engram-memory/api/memories/"+encodeURIComponent(id)),x=r.item;target.replaceChildren();const current=(x.revisions||[]).find(v=>v.revision_id===x.current_revision_id),head=el("div","detail-head");
        head.append(el("p","eyebrow","记忆档案 · "+(x.current_revision_no?"第 "+x.current_revision_no+" 版":"版本未知")),el("h2","",current?current.title:"正式记忆"));
        const meta=el("div","meta");meta.append(badge(x.status),el("span","mono",x.memory_id),el("span","","创建 "+date(x.created_at)));head.append(meta);target.append(head);
        for(const v of x.revisions||[]){const card=el("article","revision"),top=el("div","record-top");top.append(el("h3","","第 "+v.revision_no+" 版 · "+v.title),badge(v.change_reason));card.append(top,el("p","meta",label(v.memory_kind)+" · "+date(v.created_at)),el("p","meta mono","版本 ID · "+v.revision_id),el("p","meta mono","主要人物 · "+personText(v.subject)),el("p","body",""+v.content));
          if(v.participants&&v.participants.length)card.append(el("p","meta mono","次要人物 · "+v.participants.map(personText).join("、")));target.append(card)}
        sourceCards(target,x.sources);
        if(x.relations&&x.relations.length){const rel=section(target,"记忆关系");for(const a of x.relations){const c=el("article","source");c.append(el("div","source-head",a.relation_type+" · "+a.related_memory_id));if(a.reason)c.append(el("p","source-note",a.reason));rel.append(c)}}
      }catch(e){message(target,"error",e.message)}
    }
    async function personas(){
      const h=heading("Person impressions","人物印象","核心人物印象及其正式记忆依据。"),panel=el("section","panel"),grid=el("div","persona-grid");
      panel.append(filter("按人物或印象内容查找",null),grid);
      const r=await api("/engram-memory/api/personas?"+new URLSearchParams({q:state.q,limit:"100"}));if(!r.items.length)message(grid,"empty","没有已保存的人物印象。");
      for(const x of r.items){const c=el("article","persona");c.append(el("p","eyebrow","人物印象"),el("h3","",x.display_name||"称呼未记录"),el("p","persona-id mono","核心 ID · "+x.person_id),el("p","body",x.impression));const ids=[...new Set((x.impression||"").match(/\b[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}\b/gi)||[])];for(const id of ids){const open=el("button","memory-open mono","Memory ID · "+id);open.type="button";open.addEventListener("click",()=>go("memories",id));c.append(open)}c.append(el("p","meta","更新于 "+date(x.updated_at)));grid.append(c)}
      root.replaceChildren(h,panel);
    }
    function go(view,selectedId=null){state.view=view;state.id=selectedId;state.q="";state.status=selectedId&&view==="memories"?"ALL":"";crumb.textContent=titles[view];for(const b of document.querySelectorAll(".nav"))b.setAttribute("aria-current",b.dataset.view===view?"page":"false");render()}
    document.getElementById("refresh").addEventListener("click",render);
    for(const b of document.querySelectorAll(".nav"))b.addEventListener("click",()=>go(b.dataset.view));
    render();
  </script>
</body>
</html>
