<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Engram · 记忆档案</title>
  <style>
    :root {
      color-scheme: light; --ink:#24353b; --muted:#748187; --navy:#192c35;
      --navy2:#2a424a; --paper:#f4f1e9; --sheet:#fffdf8; --line:#dfdbd1;
      --brass:#bc925d; --green:#547965; --red:#a3584e;
      --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
      --sans:"Segoe UI","Microsoft YaHei UI","Noto Sans CJK SC",sans-serif;
      --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.6 var(--sans);
      background:radial-gradient(ellipse at 86% 0,rgba(188,146,93,.11),transparent 33rem),
      repeating-linear-gradient(0deg,rgba(50,63,64,.018) 0,rgba(50,63,64,.018) 1px,transparent 1px,transparent 5px),var(--paper)}
    button,input,select{font:inherit} button{cursor:pointer}
    .layout{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}
    aside{position:relative;display:flex;flex-direction:column;padding:28px 17px 20px;overflow:hidden;color:#edf0eb;background:linear-gradient(155deg,rgba(255,255,255,.04),transparent 45%),var(--navy)}
    aside:after{position:absolute;right:-115px;bottom:42px;width:260px;height:260px;border:1px solid rgba(188,146,93,.17);border-radius:50%;box-shadow:0 0 0 25px rgba(188,146,93,.025),0 0 0 50px rgba(188,146,93,.02);content:"";pointer-events:none}
    .brand{display:flex;align-items:center;gap:12px;padding:0 7px 31px}.seal{display:grid;width:38px;height:38px;place-items:center;border:1px solid #c9a878;color:#e1bf8b;font:19px var(--serif);transform:rotate(-4deg)}
    .brand strong{display:block;font:18px/1.2 var(--serif);letter-spacing:.03em}.brand small{color:#aab6b5;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
    .rail-label{margin:0 10px 9px;color:#829396;font-size:10px;letter-spacing:.16em}
    nav{position:relative;z-index:1;display:grid;gap:5px}
    .nav{width:100%;padding:10px 12px;border:1px solid transparent;border-radius:6px;color:#b9c3c1;background:transparent;text-align:left;transition:.15s}
    .nav:hover{color:#fff;background:#ffffff0c}.nav[aria-current=page]{border-color:#dbb88233;color:#fff8ec;background:linear-gradient(90deg,#bc925d2b,#bc925d0a)}
    .glyph{display:inline-block;width:24px;color:#d1ad77;font:17px var(--serif)}
    .rail-foot{position:relative;z-index:1;margin-top:auto;padding:16px 9px 0;border-top:1px solid #ffffff24;color:#92a09f;font-size:11px}
    .rail-foot strong{display:block;color:#d6dcd6;font-weight:500}
    main{min-width:0;padding:0 34px 50px}.topline{display:flex;min-height:70px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .crumb{color:var(--muted);font-size:11px;letter-spacing:.08em}.top-actions{display:flex;align-items:center;gap:14px}
    .local{color:#718278;font-size:10px;letter-spacing:.12em}.local:before{display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#6f967c;content:""}
    .refresh,.soft{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fffdf8}
    .refresh{width:35px;padding:0;font-size:17px}.refresh:hover,.soft:hover{border-color:#b9a47f}
    #view{max-width:1400px;margin:0 auto;padding-top:27px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}
    .eyebrow{margin:0 0 6px;color:#9c7d53;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    h1,h2,h3,p{margin-top:0}h1{margin-bottom:4px;font:34px/1.15 var(--serif);letter-spacing:-.02em}h2{margin-bottom:11px;font:22px/1.25 var(--serif)}h3{margin-bottom:7px;font:17px/1.3 var(--serif)}
    .sub{max-width:700px;margin:0;color:var(--muted);font-size:12px}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
    .stat{position:relative;min-height:118px;padding:17px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,#fffdf8,#f9f6ee);overflow:hidden}
    .stat:after{position:absolute;right:-25px;bottom:-55px;width:105px;height:105px;border:1px solid #bc925d38;border-radius:50%;content:""}
    .stat label,.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin:7px 0;color:var(--navy);font:32px/1 var(--serif)}
    .band{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-top:14px;padding:17px 20px;border-radius:7px;color:#eef0eb;background:var(--navy2)}
    .band h2{margin:0 0 3px;color:#f8f4e9;font-size:18px}.band p{margin:0;color:#c2ccca;font-size:11px}.band-side{display:flex;gap:22px}
    .band-side small{display:block;color:#aab9b7;font-size:9px;letter-spacing:.1em}.band-side strong{display:block;margin-top:3px;color:#f0d6ad;font:15px var(--serif)}
    .split{display:grid;grid-template-columns:minmax(260px,.82fr) minmax(0,1.4fr);gap:14px;align-items:start}
    .panel{min-width:0;padding:17px;border:1px solid var(--line);border-radius:7px;background:#fffdf8df}
    .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h2{margin:0;font-size:19px}
    .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.filters input,.filters select{min-width:0;height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:5px;outline:none;background:#fffdf8}
    .filters input{flex:1 1 130px}.filters input:focus,.filters select:focus{border-color:#aa8c62;box-shadow:0 0 0 3px #bc925d21}
    .primary{height:36px;padding:5px 13px;border:1px solid var(--navy);border-radius:5px;color:white;background:var(--navy)}.primary:hover{background:#2b4149}
    .list{display:grid;gap:7px}.record{width:100%;padding:11px 12px;border:1px solid #e5e1d7;border-radius:5px;color:var(--ink);background:#ffffff91;text-align:left;transition:.14s}
    .record:hover{border-color:#bba27c;background:#fffefa;transform:translateY(-1px)}.record[aria-pressed=true]{border-color:#b38d5a;background:#fbf6eb;box-shadow:inset 3px 0 #b38d5a}
    .record-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.record-title{font-weight:650;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;color:#899294;font-size:10px}
    .preview{display:-webkit-box;margin:6px 0 0;overflow:hidden;color:#69777a;font-size:11px;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .badge{display:inline-flex;flex:none;align-items:center;min-height:20px;padding:1px 7px;border:1px solid #e3d7c5;border-radius:99px;color:#806847;background:#f4ecdf;font:9px var(--mono);white-space:nowrap}
    .good{border-color:#d6e1d8;color:#547965;background:#edf4ee}.bad{border-color:#ead5d0;color:#a3584e;background:#faf0ee}.quiet{border-color:#dfe1dc;color:#748080;background:#f1f2ed}
    .detail{min-height:270px;padding:20px}.detail-head{padding-bottom:15px;border-bottom:1px solid var(--line)}.detail-head h2{margin:6px 0;overflow-wrap:anywhere}
    .detail-section{margin-top:17px}.detail-section h3{display:flex;align-items:center;gap:8px;color:#526369;font:10px var(--sans);font-weight:700;letter-spacing:.13em;text-transform:uppercase}
    .detail-section h3:after{flex:1;height:1px;background:#e6e2d8;content:""}.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#36474c;font-size:13px;line-height:1.8}
    .source,.revision,.audit,.persona{margin-top:8px;padding:12px;border:1px solid #e6e2d8;border-radius:5px;background:#fffefa}
    .source-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;color:#6c787a;font-size:10px}.source-note{margin:7px 0 0;color:#4f6064;font-size:11px}
    .snapshot{margin-top:9px;padding:9px 11px;border-left:2px solid #c19a67;background:#f7f4ed}.snapshot blockquote{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.7}
    .code{margin:7px 0 0;padding:10px;overflow:auto;border-radius:4px;color:#3c4c50;background:#f2f0e9;font:10px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
    .sleep-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#faf8f1}
    .sleep-toolbar-label{color:#69777a;font-size:11px}.sleep-mode{display:flex;gap:3px;padding:3px;border:1px solid #e3dfd5;border-radius:6px;background:#f0eee7}
    .sleep-mode button{min-height:30px;padding:4px 11px;border:1px solid transparent;border-radius:4px;color:#687578;background:transparent;font-size:11px}
    .sleep-mode button:hover{color:var(--navy);background:#fffdf8}.sleep-mode button[aria-pressed=true]{border-color:#d8c6aa;color:#6c5232;background:#fffdf8;box-shadow:0 1px 2px #24353b12}
    .sleep-mode button:focus-visible,.memory-open:focus-visible,.technical summary:focus-visible{outline:2px solid #a8814f;outline-offset:2px}
    .sleep-notice{margin:10px 0;padding:10px 12px;border:1px solid #ead9bc;border-left:3px solid var(--brass);border-radius:4px;color:#705a39;background:#fbf5e9;font-size:11px}
    .sleep-timeline{position:relative;display:grid;gap:9px;margin:8px 0 0;padding-left:19px}
    .sleep-timeline:before{position:absolute;top:12px;bottom:12px;left:5px;width:1px;background:#ded8ca;content:""}
    .sleep-entry{position:relative;min-width:0;padding:12px;border:1px solid #e6e2d8;border-radius:5px;background:#fffefa}
    .sleep-entry:before{position:absolute;top:17px;left:-19px;width:9px;height:9px;border:2px solid #fffdf8;border-radius:50%;background:#b38d5a;box-shadow:0 0 0 1px #b38d5a;content:""}
    .sleep-entry.warn:before{background:#a3584e;box-shadow:0 0 0 1px #a3584e}.sleep-entry.done:before{background:#547965;box-shadow:0 0 0 1px #547965}
    .sleep-entry-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;margin-bottom:5px}.sleep-entry-head strong{color:#35484d;font-size:12px}
    .sleep-time{color:#8a9493;font-size:10px}.sleep-copy{margin:5px 0 0;color:#536267;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
    .sleep-subtitle{margin:10px 0 4px;color:#87908e;font-size:10px;letter-spacing:.04em}.sleep-facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
    .sleep-fact{padding:2px 7px;border:1px solid #e5e0d4;border-radius:99px;color:#727e7e;background:#f7f5ef;font-size:10px}
    .sleep-action,.sleep-memory{margin-top:8px;padding:11px;border:1px solid #e6e2d8;border-radius:5px;background:#fffefa}
    .sleep-action h4,.sleep-memory h4{margin:0;color:#394d51;font:14px/1.4 var(--serif);overflow-wrap:anywhere}
    .sleep-action .body,.sleep-memory .body{margin-top:7px}
    .sleep-memory{border-left:3px solid #72917b}.sleep-memory.stale{border-left-color:#bc925d}
    .memory-open{min-height:31px;margin-top:9px;padding:4px 9px;border:1px solid #d9d1c2;border-radius:4px;color:#465b5b;background:#f8f5ed;font-size:10px}
    .memory-open:hover{border-color:#ad926b;background:#fffaf0}
    .technical{margin-top:7px;border:1px solid #e7e3da;border-radius:4px;background:#faf9f5}
    .technical summary{padding:6px 9px;color:#768181;font-size:10px;cursor:pointer}.technical .code{margin:0;border-radius:0 0 4px 4px}
    .trace-empty{padding:18px 11px;border:1px dashed #dcd7cc;border-radius:5px;color:#828d8c;text-align:center;font-size:11px}
    .empty,.error,.loading{padding:25px 12px;color:#849091;text-align:center}.error{color:#a3584e}.loading:before{display:inline-block;width:12px;height:12px;margin-right:7px;border:1px solid #b9aa91;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite;content:""}
    .persona-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.persona{margin:0;padding:15px}.persona h3{overflow-wrap:anywhere}.persona-id{margin:-2px 0 9px;color:#899294}.footnote{margin:14px 0;color:#909998;font-size:10px}.mono{font:10px var(--mono);overflow-wrap:anywhere}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:1050px){main{padding-right:22px;padding-left:22px}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}.band{grid-template-columns:1fr}.band-side{flex-wrap:wrap}}
    @media(max-width:720px){.layout{display:block}aside{padding:13px 12px 9px}.brand{padding:0 4px 12px}.brand strong{font-size:16px}.rail-label,.rail-foot{display:none}nav{display:flex;overflow-x:auto;gap:4px}.nav{flex:none;width:auto;padding:8px 9px;font-size:11px}.glyph{width:19px}
      main{padding:0 13px 28px}.topline{min-height:53px}#view{padding-top:19px}.heading{align-items:start;margin-bottom:17px}h1{font-size:29px}.split{grid-template-columns:1fr}.detail{min-height:220px;padding:16px}.persona-grid{grid-template-columns:1fr}.overview{gap:7px}.stat{min-height:106px;padding:13px}.stat strong{font-size:29px}.band-side{gap:15px}.sleep-toolbar{align-items:flex-start;flex-direction:column}.sleep-mode{width:100%}.sleep-mode button{flex:1}.sleep-timeline{padding-left:16px}.sleep-entry:before{left:-16px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand"><span class="seal" aria-hidden="true">E</span><span><strong>Engram</strong><small>Memory archive</small></span></div>
      <p class="rail-label">档案目录</p>
      <nav aria-label="档案栏目">
        <button class="nav" data-view="overview" aria-current="page"><span class="glyph">⌂</span>运行概览</button>
        <button class="nav" data-view="memories"><span class="glyph">▤</span>正式记忆</button>
        <button class="nav" data-view="candidates"><span class="glyph">◫</span>候选积压</button>
        <button class="nav" data-view="sleep"><span class="glyph">◷</span>Sleep 会话</button>
        <button class="nav" data-view="personas"><span class="glyph">♙</span>人物印象</button>
      </nav>
      <div class="rail-foot"><strong>本地记忆管理</strong>查看记忆与来源，整理新候选，仅在本机开放。</div>
    </aside>
    <main>
      <div class="topline"><span class="crumb">ENGRAM / <span id="crumb">运行概览</span></span><div class="top-actions"><span class="local">LOCAL ACCESS</span><button class="refresh" id="refresh" aria-label="刷新" title="刷新">↻</button></div></div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <script>
    "use strict";
    const root = document.getElementById("view"), crumb = document.getElementById("crumb");
    const titles = {overview:"运行概览",memories:"正式记忆",candidates:"候选积压",sleep:"Sleep 会话",personas:"人物印象"};
    const state = {view:"overview",id:null,q:"",status:"",sleepMode:"readable"};
    function el(tag, cls, text) { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined&&text!==null)n.textContent=String(text); return n; }
    function date(value) { if(value===null||value===undefined||value==="")return "时间未知"; const d=new Date(typeof value==="number"?value*1000:value); return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d); }
    async function api(path,options={}) {
      const r=await fetch(path,{headers:{Accept:"application/json"},cache:"no-store",credentials:"same-origin",...options});
      let data={}; try{data=await r.json()}catch(_){}
      if(!r.ok)throw new Error(data.detail||("请求失败（"+r.status+"）")); return data;
    }
    function message(parent,cls,text){parent.replaceChildren(el("div",cls,text))}
    function heading(kicker,title,sub){const h=el("div","heading"),c=el("div");c.append(el("p","eyebrow",kicker),el("h1","",title),el("p","sub",sub));h.append(c);return h}
    const labels={ACTIVE:"可用",RESOLVED:"已处理",COMPLETED:"已完成",RECORDED:"已记录",FAILED:"失败",TOMBSTONED:"已封存",PENDING:"待整理",PROCESSING:"处理中",RUNNING:"运行中",DEFERRED:"暂缓",PARTIAL:"部分完成",MERGED:"已合并",AVAILABLE:"来源可读取",REDACTED:"来源已隐私删除",NOT_CAPTURED:"来源缺失",UNKNOWN:"未知",CREATE_NEW:"新建",REINFORCE:"强化",REVISE:"修订",MERGE:"合并",RELATE:"关联",DEFER:"暂缓",IGNORE:"不记入",PREPARED:"已准备",EXECUTING:"执行中",DAILY:"每日整理",PRESSURE:"积压整理",FACT:"事实",EVENT:"经历",PREFERENCE:"偏好",CHAT_MESSAGE:"聊天消息",LEGACY_IMPORT:"历史导入"};
    Object.assign(labels,{RELATIONSHIP:"关系",COMMITMENT:"约定",PERSONAL_STATE:"个人状态",SOCIAL_PATTERN:"社交模式",INITIAL:"初次记录",DEVELOPMENT:"经历发展",CORRECTION:"更正",CLARIFICATION:"澄清",NEW_EVIDENCE:"补充来源",EXPLICIT_CORRECTION:"本人更正",ADMIN_CORRECTION:"管理员更正",MIGRATION_REWRITE:"迁移整理",MESSAGE_SET:"原始消息",ACTOR_WRITE:"主动记忆",SYSTEM_EVENT:"系统事件",LEGACY_RECORD:"历史记录",ADMIN:"管理员",EXTERNAL:"外部来源",MANUAL:"手动整理",RECOVERY:"中断恢复",SUCCEEDED:"成功",SUCCESS:"成功",COMMITTED:"已提交",NOT_STARTED:"未开始"});
    function label(value){return labels[value]||value||"未知"}
    function badge(value){const t=String(value||"UNKNOWN"),c=["ACTIVE","RESOLVED","COMPLETED","RECORDED"].includes(t)?"badge good":["FAILED","TOMBSTONED"].includes(t)?"badge bad":["PENDING","PROCESSING","RUNNING"].includes(t)?"badge":"badge quiet";return el("span",c,label(t))}
    function section(parent,title){const s=el("section","detail-section");s.append(el("h3","",title));parent.append(s);return s}
    function sourceCards(parent,sources){
      const area=section(parent,"关联来源");
      if(!sources||!sources.length){area.append(el("p","empty","没有记录关联来源。"));return}
      for(const s of sources){const card=el("article","source");const top=el("div","source-head");top.append(badge(s.source_type),el("span","mono",s.evidence_id));if(s.revision_no)top.append(el("span","","第 "+s.revision_no+" 版"));if(s.observed_at)top.append(el("span","",date(s.observed_at)));card.append(top);
        if(s.note)card.append(el("p","source-note",s.note));if(s.source_ref)card.append(el("p","source-note","来源标记："+s.source_ref));
        for(const m of s.messages||[]){const snap=el("div","snapshot"),meta=el("div","source-head");meta.append(badge(m.snapshot_status),el("span","mono","流 "+m.stream_id),el("span","mono","消息 "+m.message_id));if(m.speaker)meta.append(el("span","",m.speaker));if(m.observed_at)meta.append(el("span","",date(m.observed_at)));snap.append(meta);snap.append(el("blockquote","",m.content||"来源快照正文不可用。"));card.append(snap)}
        area.append(card);
      }
    }
    function split(title){const grid=el("div","split"),left=el("section","panel"),head=el("div","panel-head"),list=el("div","list"),right=el("section","panel detail");head.append(el("h2","",title));left.append(head,list);message(right,"empty","从左侧选择一条记录查看档案。");grid.append(left,right);return{grid,left,list,right}}
    function record(item,idKey,title,preview,meta,select){const b=el("button","record");b.type="button";b.setAttribute("aria-pressed",String(item[idKey]===state.id));const top=el("span","record-top");top.append(el("span","record-title",title||"未命名记录"),badge(item.status));b.append(top);const m=el("span","meta");for(const v of meta||[])if(v)m.append(el("span","",v));b.append(m);if(preview)b.append(el("span","preview",preview));b.addEventListener("click",select);return b}
    async function render(){
      root.replaceChildren(el("div","loading","正在读取档案…"));
      try{if(state.view==="overview")await overview();else if(state.view==="memories")await memories();else if(state.view==="candidates")await candidates();else if(state.view==="sleep")await sleep();else await personas()}
      catch(e){root.replaceChildren(heading("读取状态","档案暂不可用","请确认从本机打开管理页，且 Engram vNext Runtime 已就绪。"),el("div","panel error",e.message))}
    }
    async function overview(){
      const r=await api("/engram-memory/api/status"),m=r.memory_counts||{},c=r.candidate_counts||{};
      const h=heading("Runtime overview","记忆档案","查看已保存的记忆、来源和 Sleep 整理记录。");
      const grid=el("div","overview");
      for(const [label,value,note] of [["正式记忆",m.ACTIVE||0,"当前可用"],["记忆版本",r.revision_count||0,"包含保留的历史版本"],["自动整理积压",r.automatic_backlog_count||0,"新聊天的待整理候选"],["历史待整理",r.historical_backlog_count||0,"旧候选保留原状态"]]){
        const card=el("div","stat");card.append(el("label","",label),el("strong","",value),el("small","",note));grid.append(card)}

        else{card.append(el("p","sleep-copy","已记录模型响应，但无法解析为已知步骤类型。"));if(data.raw_response)technical(card,"模型原始响应",data.raw_response);else technical(card,"模型输出字段",data)}
      }else if(name==="overall_summary"){
        if(data.status)addFact(card,"状态 "+label(String(data.status).toUpperCase()));
        if(data.elapsed_seconds!==undefined)addFact(card,"整轮耗时 "+Number(data.elapsed_seconds).toFixed(1)+" 秒");
        if(data.sleep_llm_calls!==undefined)addFact(card,"记忆整理调用 "+data.sleep_llm_calls+" 次");
        if(data.persona_llm_calls!==undefined)addFact(card,"人物印象调用 "+data.persona_llm_calls+" 次");
      }else if(name==="post_action_review_input"){
        card.append(el("p","sleep-copy","把已执行的动作、正式记忆回读和原始消息交给模型，检查人物、时间、计划及陈述归属。"));
        technical(card,"查看实际复核输入",data.prompt||data);
      }else if(name.startsWith("post_action_")){
        if(data.error||data.reason)card.append(el("p","sleep-copy",data.error||data.reason));
        if(data.correction_count!==undefined)addFact(card,"需要纠正 "+data.correction_count+" 条");
        if(data.writes_committed)card.append(el("p","sleep-copy","已有正式写入保留，未完成的复核将再次处理。"));
        technical(card,"查看执行后复核记录",data);
      }else if(name==="protocol_error"){
        card.append(el("p","sleep-copy",data.message||data.error||"模型输出未满足 Sleep 协议，需要修正。"));
        if(data.received)technical(card,"收到的内容",data.received);
      }else if(name==="model_error"){
        card.append(el("p","sleep-copy",data.error||data.message||"模型调用失败，未形成可展示的步骤输出。"));
      }else if(name==="group_decision"){
        card.append(el("p","sleep-copy","校验后的分组决定；是否落库仍以数据库操作记录为准。"));
        for(const action of Array.isArray(data.actions)?data.actions:[])actionCard(card,action,claims,"决定");
      }else if(name==="action_start"){
        const action=data.action||data.intent;if(action)actionCard(card,action,claims,"开始执行");
        else card.append(el("p","sleep-copy","动作执行已开始。"));
      }else if(name==="action_end"){
        card.append(el("p","sleep-copy","执行器记录了动作完成；实际写入正文见下方数据库操作与回读。"));
        if(data.action_type)addFact(card,"动作 "+actionName(data.action_type));
        if(Array.isArray(data.target_memory_ids))addFact(card,data.target_memory_ids.length+" 条目标记忆");
        if(data.target_memory_ids)technical(card,"目标记忆 ID",data.target_memory_ids);
      }else if(key==="SEARCH"){
        renderSearchEntry(card,{...data,claims});
      }else if(key==="MEMORY_READ"){
        renderMemoryReadEntry(card,data);
      }else if(key==="EVIDENCE_READ"){
        const request=asRecord(data.request),ids=data.evidence_ids||request.evidence_ids;
        if(Array.isArray(ids))addFact(card,"读取 "+ids.length+" 条来源");if(ids)technical(card,"来源 ID",ids);
        const result=data.results!==undefined?data.results:data.result;if(result!==undefined)renderEvidenceList(card,result);
        else card.append(el("p","sleep-copy","记录了来源回读请求，结果详情未附在此事件中。"));
      }else if(key==="MESSAGE_CONTEXT_READ"){
        const result=asRecord(data.result),messages=Array.isArray(result.messages)?result.messages:[];
        card.append(el("p","sleep-copy","读取同一聊天的来源前后文及回复目标，共 "+messages.length+" 条消息；读取本身不会保存整段聊天。"));
        const status=asRecord(result.context_status);
        if(status.core_window==="anchor_missing")card.append(el("p","sleep-notice","原聊天中的锚点已不可用，现有快照无法代表完整前后文。"));
        renderEvidenceList(card,[{title:"实际读到的聊天",messages}]);technical(card,"完整聊天与读取状态",result);
      }else if(name==="context_sources_saved"){
        const ids=Array.isArray(data.message_ids)?data.message_ids:[];
        card.append(el("p","sleep-copy","已为本次实际引用的 "+ids.length+" 条消息保存关联证据，包含必要回复目标。"));
        technical(card,"已关联的来源与消息 ID",data);
      }else if(name==="self_check"||name==="readback"){
        card.classList.add("done");
        if(data.memory_id)technical(card,"回读记忆 ID",data.memory_id);
        if(data.evidence_count!==undefined)addFact(card,"核对 "+data.evidence_count+" 条来源");
        if(data.result||data.memory||data.result_memories)renderMemoryReadEntry(card,data);
        else if(Array.isArray(data.evidence)){renderEvidenceList(card,data.evidence);if(data.candidate_evidence_ids)technical(card,"候选来源 ID",data.candidate_evidence_ids)}
        else card.append(el("p","sleep-copy","已记录执行后回读核对；正文以数据库操作的版本快照为准。"));
      }else if(name==="recent_formal_memories"){
        const memories=Array.isArray(data.memories)?data.memories:[];card.append(el("p","sleep-copy","本轮预读近期正式记忆："+memories.length+" 条。"));
        for(const memory of memories.slice(0,8)){const item=asRecord(memory);card.append(el("p","sleep-copy",(item.title||"正式记忆")+(item.content?" · "+item.content:"")))}
        if(memories.length>8)card.append(el("p","sleep-copy","另有 "+(memories.length-8)+" 条。"));
      }else if(name==="session_start"||name==="group_start"){
        const ids=data.candidate_ids||data.candidates;if(Array.isArray(ids))addCandidateFacts(card,ids,claims);
        if(data.trigger_type)addFact(card,"触发方式 "+label(data.trigger_type));
      }else if(name==="session_end"){
        if(data.status)addFact(card,"状态 "+label(String(data.status).toUpperCase()));if(data.error||data.error_summary)card.append(el("p","sleep-copy",data.error||data.error_summary));
      }else if(name==="PERSON_LOOKUP"){
        const result=data.result||data.results;if(result!==undefined)card.append(el("p","sleep-copy",typeof result==="string"?result:"已回读人物资料。"));else card.append(el("p","sleep-copy","记录了人物资料查询。"));
      }else{
        const request=data.request||data.query||data.action;if(request)card.append(el("p","sleep-copy",typeof request==="string"?request:jsonText(request)));
        const result=data.result||data.results;if(result!==undefined)card.append(el("p","sleep-copy","已记录工具结果。"));
        technical(card,"事件数据",event?.data);
      }
      const candidateIds=data.candidate_ids;if(candidateIds&&!(["group_decision","action_start"].includes(name)))addCandidateFacts(card,candidateIds,claims);
      parent.append(card);
    }
    function renderTrace(parent,x){
      const area=section(parent,"Sleep 实际过程"),events=Array.isArray(x.trace_events)?x.trace_events:[];
      if(x.trace_notice)area.append(el("p","sleep-notice",x.trace_notice));
      else if(x.trace_available===false)area.append(el("p","sleep-notice","此会话没有可读取的实际对话记录；下方只展示数据库操作与版本回读，不会补造模型对话。"));
      if(!events.length){area.append(el("div","trace-empty","没有已保存的过程事件。可在数据库操作与版本回读中查看实际执行结果。"));return}
      const timeline=el("div","sleep-timeline");for(const event of events)renderTraceEvent(timeline,event,x.claims||[]);area.append(timeline);
    }
    function renderResultMemory(parent,memory){
      const item=asRecord(memory),stale=item.is_current===false,card=el("article","sleep-memory"+(stale?" stale":"")),title=el("h4","",item.title||"已写入记忆");
      const top=el("div","record-top");top.append(title);if(item.status)top.append(sleepStatus(item.status));card.append(top);
      card.append(el("p","meta",item.revision_no?"本次版本 · 第 "+item.revision_no+" 版":"本次版本"));
      if(item.revision_id)technical(card,"版本 ID",item.revision_id);
      if(stale)card.append(el("p","sleep-notice","这是本次整理时的版本，当前记忆已更新。打开详情会查看当前记忆。"));
      if(item.content)card.append(el("p","body",item.content));else card.append(el("p","sleep-copy","本次版本正文不可用。"));
      if(item.memory_id){technical(card,"记忆 ID",item.memory_id);const open=el("button","memory-open","查看记忆详情");open.type="button";open.addEventListener("click",()=>go("memories",item.memory_id));card.append(open)}
      parent.append(card);
    }
    function renderOperations(parent,x){
      const area=section(parent,"数据库操作与版本回读"),operations=Array.isArray(x.operations)?x.operations:[];
      if(!operations.length){area.append(el("p","empty","没有数据库操作记录。模型计划本身不代表执行成功。"));return}
      for(const operation of operations){
        const op=asRecord(operation),card=el("article","audit"),head=el("div","record-top"),intent=asRecord(op.intent),action=asRecord(intent.action||intent),memories=Array.isArray(op.result_memories)?op.result_memories:[];
        head.append(el("strong","",actionName(op.action_type||action.action_type)+(memories[0]?.title?" · "+memories[0].title:"")),sleepStatus(op.status));card.append(head);
        card.append(el("p","meta",date(op.created_at)+(op.updated_at?" · 更新于 "+date(op.updated_at):"")));
        actionCard(card,action,x.claims||[],"数据库操作");
        if(op.error)card.append(el("p","source-note",op.error));
        if(memories.length){for(const memory of memories)renderResultMemory(card,memory)}
        else if(["DEFER","IGNORE","RELATE"].includes(String(op.action_type||action.action_type||"").toUpperCase()))card.append(el("p","sleep-copy","此类操作没有创建或更新正式记忆正文。"));
        else if(op.memory_readback_available===false)card.append(el("p","sleep-notice","本次记忆正文回读不可用；执行状态以数据库操作状态为准。"));
        else if(op.memory_readback_available===true)card.append(el("p","sleep-copy","此操作没有关联到可展示的记忆正文版本。"));
        else card.append(el("p","sleep-copy","接口未提供本次版本正文回读信息；不会用当前版本代替本次结果。"));
        const result=op.result;if(result!==undefined)technical(card,"数据库结果字段",result);
        const ids={};for(const key of ["operation_key","candidate_id"]){if(op[key]!==undefined)ids[key]=op[key]}
        if(Object.keys(ids).length)technical(card,"操作技术 ID",ids);area.append(card);
      }
    }
    function renderReadableSleep(target,x){
      const info=section(target,"会话信息"),meta=el("p","meta","模型任务 "+(x.model_id||"未记录")+" · 提示版本 "+(x.prompt_version||"未知"));
      info.append(meta);if(x.error_summary)info.append(el("p","source-note",x.error_summary));
      technical(info,"会话技术信息",{sleep_session_id:x.sleep_session_id,started_at:x.started_at,finished_at:x.finished_at,trigger_type:x.trigger_type});
      const claims=section(target,"候选认领");if(!Array.isArray(x.claims)||!x.claims.length)claims.append(el("p","empty","没有候选认领记录。"));
      for(const claim of x.claims||[]){const card=el("article","audit"),top=el("div","record-top");top.append(el("strong","",claim.candidate_title||"候选记录"),sleepStatus(claim.outcome||"PROCESSING"));card.append(top,el("p","meta",date(claim.claimed_at)+(claim.released_at?" · 释放于 "+date(claim.released_at):"")));technical(card,"候选 ID",claim.candidate_id);claims.append(card)}
      renderTrace(target,x);renderOperations(target,x);
    }
    function rawBlock(parent,title,value){
      const area=section(parent,title),pre=el("pre","code",jsonText(value));area.append(pre);
    }
    function renderRawSleep(target,x){
      const traceAvailable=x.trace_available===true,notice=x.trace_notice||(!traceAvailable?"此会话没有可读取的完整实际对话记录；原始视图不会补造模型输入或工具过程。":"");
      if(notice)target.append(el("p","sleep-notice",notice));
      rawBlock(target,"原始 Trace 事件",Array.isArray(x.trace_events)?x.trace_events:[]);
      rawBlock(target,"数据库操作 JSON",Array.isArray(x.operations)?x.operations:[]);
      rawBlock(target,"候选认领 JSON",Array.isArray(x.claims)?x.claims:[]);
      rawBlock(target,"计划 JSON",Array.isArray(x.plans)?x.plans:[]);
      rawBlock(target,"已提交动作 JSON",Array.isArray(x.actions)?x.actions:[]);
    }
    async function sleep(){
      const p=split("Sleep 会话"),h=heading("Sleep sessions","Sleep 会话","查看每步检索、模型决定、实际操作和最终写入的记忆正文。");
      const run=el("button","primary","整理新候选");run.type="button";run.title="只整理新聊天候选，旧积压继续保留。";
      run.addEventListener("click",async()=>{run.disabled=true;run.textContent="正在查证与整理…";try{const result=await api("/engram-memory/api/sleep/run",{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:"{}"});if(result.ran){state.id=result.sleep_session_id;await sleep()}else{run.disabled=false;run.textContent="整理新候选";message(p.right,"empty","当前没有可整理的新候选。")}}catch(e){run.disabled=false;run.textContent="整理新候选";message(p.right,"error",e.message)}});h.append(run);
      const r=await api("/engram-memory/api/sleep?limit=60");p.list.replaceChildren();if(!r.items.length)message(p.list,"empty","尚无 Sleep 会话记录。");
      for(const x of r.items)p.list.append(record(x,"sleep_session_id",label(x.trigger_type),x.candidate_count+" 条候选",[date(x.started_at),x.prompt_version],()=>{state.id=x.sleep_session_id;detailSleep(p.right,x.sleep_session_id)}));
      root.replaceChildren(h,p.grid);if(state.id)detailSleep(p.right,state.id);
    }
    async function detailSleep(target,id){
      message(target,"loading","正在读取会话审计…");
      try{
        const r=await api("/engram-memory/api/sleep/"+encodeURIComponent(id)),x=r.item;target.replaceChildren();
        const head=el("div","detail-head");head.append(el("p","eyebrow","Sleep run"),el("h2","",label(x.trigger_type)));
        const meta=el("div","meta");meta.append(sleepStatus(x.status),el("span","",date(x.started_at)),el("span","",x.candidate_count+" 条候选"));head.append(meta);target.append(head);
        const toolbar=el("div","sleep-toolbar"),modeLabel=el("span","sleep-toolbar-label","详情显示方式"),group=el("div","sleep-mode");group.setAttribute("role","group");group.setAttribute("aria-label","Sleep 会话详情显示方式");
        const content=el("div","sleep-content");
        for(const [mode,text] of [["readable","可读"],["raw","原始"]]){
          const button=el("button","",text);button.type="button";button.setAttribute("aria-pressed",String(state.sleepMode===mode));button.dataset.mode=mode;
          button.addEventListener("click",()=>{state.sleepMode=button.dataset.mode;for(const option of group.querySelectorAll("button"))option.setAttribute("aria-pressed",String(option===button));content.replaceChildren();if(state.sleepMode==="raw")renderRawSleep(content,x);else renderReadableSleep(content,x)});group.append(button);
        }
        toolbar.append(modeLabel,group);target.append(toolbar,content);
        if(state.sleepMode==="raw")renderRawSleep(content,x);else renderReadableSleep(content,x);
      }catch(e){message(target,"error",e.message)}
    }
    async function personas(){
      const h=heading("Person impressions","人物印象","读取核心数据库的人物印象；Sleep 在正式记忆整理后审查并更新。"),panel=el("section","panel"),grid=el("div","persona-grid");
      panel.append(filter("按人物或印象内容查找",null),grid);
      const r=await api("/engram-memory/api/personas?"+new URLSearchParams({q:state.q,limit:"100"}));if(!r.items.length)message(grid,"empty","没有已保存的人物印象。");
      for(const x of r.items){const c=el("article","persona");c.append(el("p","eyebrow","人物印象"),el("h3","",x.display_name||"称呼未记录"),el("p","persona-id mono","核心 ID · "+x.person_id),el("p","body",x.impression));const m=el("p","meta","更新于 "+date(x.updated_at));if(x.last_sleep_session_id)m.append(el("span","mono"," · Sleep "+x.last_sleep_session_id));c.append(m);grid.append(c)}
      root.replaceChildren(h,panel);
    }
    function go(view,selectedId=null){state.view=view;state.id=selectedId;state.q="";state.status=selectedId&&view==="memories"?"ALL":"";crumb.textContent=titles[view];for(const b of document.querySelectorAll(".nav"))b.setAttribute("aria-current",b.dataset.view===view?"page":"false");render()}
    document.getElementById("refresh").addEventListener("click",render);
    for(const b of document.querySelectorAll(".nav"))b.addEventListener("click",()=>go(b.dataset.view));
    render();
  </script>
</body>
